        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        timeout-minutes: 5
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Audit exact source against the Regula standard
        run: ./scripts/lean.sh lint
