name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The private development repository retains its local-only acceptance policy.
    # This workflow becomes active in the separately authorized public-source repo.
    if: github.repository == 'rbeauchamp/acorn'
    # The standard Apple Silicon runner has three cores for private launch
    # validation as well as public CI; the complete cold suite retains its deadline.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision system tools
        run: |
          brew install coreutils elan openssl@3 shellcheck
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - name: Provision pinned Lean and Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Verify exact source with cold project outputs
        run: |
          test "$(cat verification-profile)" = public
          ./scripts/verify.sh
