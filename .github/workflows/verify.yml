name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The standard Apple Silicon runner has three cores; the complete cold suite
    # retains the same deadline as local verification.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ACORN_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACORN_VERIFY_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm checked-out commit
        run: test "$(git rev-parse HEAD)" = "$ACORN_VERIFY_SHA"
      - name: Provision system tools
        run: |
          brew install coreutils elan openssl@3 shellcheck
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies only
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: lean-deps-v2-macos-15-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - name: Provision pinned Lean and Mathlib
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: lean
        run: lake exe cache get
      - name: Admit provisioned dependencies
        run: ./scripts/lean.sh provision-status
      - name: Save admitted dependencies before project verification
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify exact source with cold project outputs
        run: ./scripts/verify.sh
