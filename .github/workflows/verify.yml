name: Verify
# GitHub runs the merge gate here, on a pull request's head commit, when the pull request is
# opened or reopened and at every push to its branch, whether that branch is in this
# repository or in a fork, and when started by hand. The one job provisions the pinned
# dependencies and then runs the checked-out commit's own ./scripts/gate.sh with no argument,
# the command the no-mistakes pipeline also runs before a pull request opens
# (.no-mistakes.yaml). So the checks GitHub runs are that script's, and a head whose script
# is older or newer than main's is checked by its own.
#
# A pull request's run is started by the pull_request event, never pull_request_target, so
# the run for a fork's pull request receives no secret of this repository and a token that
# cannot write to it; this file names no secret and asks for read access to contents only.
# No filter names a base branch, so a pull request to another base that is later retargeted
# to main keeps the run made on its head. Nothing runs after a merge.
#
# No step restores or saves a cache: every run provisions everything from its pinned
# sources. A copy stored by an earlier head of a pull request, which controls its own
# workflow, could otherwise be restored and trusted by a later head. No setting cancels or
# skips a run because a later head arrived: each head's run finishes, and its result stays
# on that commit.
#
# GitHub runs the version of this file in the pull request's merge with its base, so a pull
# request that edits this file is checked by its own edit. GitHub starts no run for a head
# that conflicts with its base or whose commit message carries a skip instruction, and can
# hold a fork's run until a maintainer approves it. A head for which no run of this job is
# shown has not been checked here, which is not the same as a run that failed
# (docs/verification.md, "Build and source inventory", gives each case and what the pull
# request then shows).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
env:
  # The elan release for x64 Linux. The SHA-256 of its archive admits the download.
  ELAN_VERSION: 4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
# Every step that reaches the network before the gate declares timeout-minutes, so a
# stalled transfer fails that step at its own limit and never holds the job to the job's.
# Each limit exceeds the slowest time observed for its step. No step continues after a
# failure.
jobs:
  gate:
    # The standard public Ubuntu runner has four CPUs and 16 GB RAM. The job's limit is the
    # sum of the limits of the two jobs that ran these checks side by side before; no
    # check's own deadline is changed, and each of verification's two stages keeps
    # verify.sh's 360-second deadline. Regula's contract names Ubuntu 24.04.5 LTS on x86-64,
    # the release that this runner image held when Regula observed it; an image of another
    # release is outside that contract.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Identify the commit to verify
        id: commit
        # For a pull request, the head commit that the event itself carries (GitHub's
        # documentation, Events that trigger workflows, pull_request: github.sha is the
        # merge commit, and github.event.pull_request.head.sha the last commit of the head
        # branch). The same page says the event's payload is empty for a pull request from
        # a fork; an event that carries no head fails here, before any check, and never
        # falls back to the merge commit. A run started by hand verifies its own commit.
        env:
          ACORN_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            sha="$ACORN_PULL_REQUEST_HEAD"
          else
            sha="$GITHUB_SHA"
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The $GITHUB_EVENT_NAME event names no commit to verify."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm checked-out commit
        env:
          ACORN_VERIFY_SHA: ${{ steps.commit.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$ACORN_VERIFY_SHA"
      - name: Admit the runner image's system packages
        # The image provides these, so the step installs nothing and uses no
        # network. libc6-dev, gcc, g++, make and dpkg-dev are everything the
        # build-essential metapackage depends on. A missing package fails the
        # step with its name.
        run: |
          status=0
          for package in libc6-dev gcc g++ make dpkg-dev curl git libgmp-dev openssl shellcheck coreutils; do
            if [[ $(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true) == 'install ok installed' ]]; then
              dpkg-query -W -f='${Package} ${Version}\n' "$package"
            else
              echo "::error::The runner image does not provide $package."
              status=1
            fi
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          exit "$status"
      - name: Provision pinned elan
        timeout-minutes: 2
        # curl's own limits end the download: no attempt lasts more than 30 seconds
        # and none starts more than 62 seconds after the first began, so curl exits
        # within 92 seconds with its error. The archive is admitted by its SHA-256
        # before anything in it runs, and the installer downloads no toolchain.
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            archive="$RUNNER_TEMP/elan.tar.gz"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-max-time 60 \
              --output "$archive" \
              "https://github.com/leanprover/elan/releases/download/v$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
            sha256sum --check --strict <<< "$ELAN_SHA256  $archive"
            tar -xzf "$archive" -C "$RUNNER_TEMP" elan-init
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          fi
          version="$(elan --version)"
          echo "$version"
          if [[ $version != "elan $ELAN_VERSION "* ]]; then
            echo "::error::elan is not the pinned release $ELAN_VERSION."
            exit 1
          fi
      - name: Provision pinned Lean, Mathlib and Regula
        timeout-minutes: 15
        working-directory: lean
        # The upstream cache can omit modules; Lake compiles only those it lacks.
        # Regula's lint driver is compiled here.
        run: lake exe cache get && lake build Mathlib regula/lint
      - name: Provision the FloatLib, lean-intent and Regula modules the project imports
        working-directory: lean
        # FloatLib and lean-intent publish no build cache. This step compiles the
        # modules that AcornVerif.FloatLibBridge, AcornVerif.LeanIntentBridge and
        # AcornTools.Intent import, the native objects of the lean-intent modules
        # that AcornTools.Intent links, and the Regula interface modules that the
        # decision registries import, so verification never compiles a dependency
        # inside its deadline.
        run: lake build floatlibBridge regulaInterface leanIntentBridge leanIntentNative
      - name: Admit provisioned dependencies
        run: ./scripts/lean.sh provision-status
      # The documentation site's own dependencies (Verso, SubVerso, MD4Lean and
      # illuminate), locked by site/lake-manifest.json into the shared
      # lean/.lake/packages. Verification requires Verso built already and never
      # compiles it inside its deadline.
      - name: Provision pinned Verso
        timeout-minutes: 12
        working-directory: site
        # Verso precompiles its modules, so the documents load VersoManual's shared
        # library, which the library's default target does not build. This step
        # builds both and configures the site workspace over every locked
        # dependency, so verification does neither inside its deadline.
        run: lake build verso/VersoManual verso/VersoManual:shared
      # The merge gate itself, by the script of the commit under verification. Its own
      # provisioning finds the dependencies current. It then runs verification as two timed
      # stages, each under verify.sh's own 360-second deadline: the cold build fills all four
      # CPUs, and with the checks beside it a slow runner came within 40 seconds of one
      # deadline. Stage one admits the sources and builds cold every module outside the
      # proof library AcornVerif, its native object and every executable. Stage two is the
      # complete command unchanged: Lake reuses a stage one output only where its trace
      # matches the checked-out source, toolchain and options, and builds everything else.
      # The script then runs the Regula audit (scripts/regula.sh,
      # docs/verification.md#regula-audit), lean-intent's confirmation and implementation
      # checks (lean/AcornTools/Intent.lean) and the check of each target's pin file
      # (lean/AcornTools/Frame.lean), each also when an earlier check failed, and exits
      # non-zero when any check failed. Its `gate:` lines give the time of each part.
      - name: The merge gate on the exact source
        run: ./scripts/gate.sh
