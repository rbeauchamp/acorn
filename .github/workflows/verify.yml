name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The standard public Ubuntu runner has four CPUs and 16 GB RAM; the cold suite
    # retains the same deadline as local verification.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACORN_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACORN_VERIFY_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm checked-out commit
        run: test "$(git rev-parse HEAD)" = "$ACORN_VERIFY_SHA"
      - name: Provision system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libgmp-dev openssl shellcheck coreutils elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Identify the FloatLib modules the proof bridge imports
        id: bridge
        # The import lines select what the FloatLib step below builds, so they
        # belong to the cache identity; the proofs that follow them do not.
        run: |
          set -o pipefail
          imports="$(sed -n '/^import FloatLib\./p' lean/AcornVerif/FloatLibBridge.lean | sort)"
          echo "imports=$(printf '%s\n' "$imports" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned dependencies only
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: lean-deps-v3-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ steps.bridge.outputs.imports }}
          # A changed import set restores the same locked dependencies, builds
          # only the added modules below and saves them under the new key.
          restore-keys: |
            lean-deps-v3-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Provision pinned Lean, Mathlib and Regula
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: lean
        # The upstream cache can omit modules; Lake compiles only those it lacks.
        # Regula's lint driver and audit worker are compiled here, so both jobs
        # provision the same dependency cache.
        run: lake exe cache get && lake build Mathlib regula/lint regula/axiomGate
      - name: Provision the FloatLib modules the proof bridge imports
        working-directory: lean
        # FloatLib publishes no build cache. This step compiles the modules that
        # AcornVerif.FloatLibBridge imports, so verification never compiles a
        # dependency inside its deadline. On an exact cache hit it has nothing to
        # build.
        run: lake build floatlibBridge
      - name: Admit provisioned dependencies
        run: ./scripts/lean.sh provision-status
      - name: Save admitted dependencies before project verification
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # The documentation site's own dependencies (Verso, SubVerso, MD4Lean and
      # illuminate), locked by site/lake-manifest.json into the shared
      # lean/.lake/packages. They are cached apart from the dependencies above, which
      # the Regula job restores without them. Verification requires Verso built
      # already and never compiles it inside its deadline.
      - name: Restore pinned Verso dependencies only
        id: verso
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            lean/.lake/packages/verso
            lean/.lake/packages/subverso
            lean/.lake/packages/MD4Lean
            lean/.lake/packages/illuminate
          key: verso-deps-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('site/lean-toolchain', 'site/lake-manifest.json') }}
      - name: Provision pinned Verso
        if: steps.verso.outputs.cache-hit != 'true'
        working-directory: site
        run: lake build verso/VersoManual
      - name: Save pinned Verso dependencies before project verification
        if: steps.verso.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            lean/.lake/packages/verso
            lean/.lake/packages/subverso
            lean/.lake/packages/MD4Lean
            lean/.lake/packages/illuminate
          key: ${{ steps.verso.outputs.cache-primary-key }}
      - name: Verify exact source with cold project outputs
        run: ./scripts/verify.sh
  regula:
    # Regula audits every surface lean/foundation_manifest.json claims. It builds
    # the claimed modules from source again and takes longer than verification's
    # deadline allows, so it is a second required check with this job's timeout.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACORN_VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACORN_VERIFY_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm checked-out commit
        run: test "$(git rev-parse HEAD)" = "$ACORN_VERIFY_SHA"
      - name: Provision system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libgmp-dev openssl shellcheck coreutils elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Identify the FloatLib modules the proof bridge imports
        id: bridge
        # The import lines select what the FloatLib step below builds, so they
        # belong to the cache identity; the proofs that follow them do not.
        run: |
          set -o pipefail
          imports="$(sed -n '/^import FloatLib\./p' lean/AcornVerif/FloatLibBridge.lean | sort)"
          echo "imports=$(printf '%s\n' "$imports" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned dependencies only
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: lean-deps-v3-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ steps.bridge.outputs.imports }}
          # A changed import set restores the same locked dependencies, builds
          # only the added modules below and saves them under the new key.
          restore-keys: |
            lean-deps-v3-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Provision pinned Lean, Mathlib and Regula
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: lean
        # The upstream cache can omit modules; Lake compiles only those it lacks.
        # Regula's lint driver and audit worker are compiled here, so both jobs
        # provision the same dependency cache.
        run: lake exe cache get && lake build Mathlib regula/lint regula/axiomGate
      - name: Provision the FloatLib modules the proof bridge imports
        working-directory: lean
        # FloatLib publishes no build cache. This step compiles the modules that
        # AcornVerif.FloatLibBridge imports, so verification never compiles a
        # dependency inside its deadline. On an exact cache hit it has nothing to
        # build.
        run: lake build floatlibBridge
      - name: Admit provisioned dependencies
        run: ./scripts/lean.sh provision-status
      - name: Save admitted dependencies before the audit
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Audit exact source against the Regula standard
        run: ./scripts/lean.sh lint
