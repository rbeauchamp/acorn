# Configuration of the no-mistakes pipeline, which validates every change to Acorn before it
# reaches GitHub. no-mistakes reads every setting below only from the copy of this file on the
# default branch, so a change to it governs the runs that follow its merge, not its own.
#
# The pipeline's Test step runs scripts/gate.sh, Acorn's merge gate, in a checkout of the exact
# commit it validates, holding only tracked files. The script provisions the pinned dependencies
# and runs every merge check: both stages of ./scripts/verify.sh, the Regula audit
# ./scripts/regula.sh, lean-intent's confirmation and implementation checks
# (lean/AcornTools/Intent.lean), and the check of each target's pinned frame
# (lean/AcornTools/Frame.lean). Any failing check fails the step.
#
# GitHub runs the same script on a pull request's head commit at each event that gives the pull
# request its head (.github/workflows/verify.yml). This file sets no `no_ci`, the declaration that a
# repository has no checks on its forge, so the pipeline expects them: once it has opened a pull
# request it reports the pull request ready only when every check that GitHub registers on the
# pull request's head commit has passed, and never while GitHub registers none there
# (no-mistakes' repo-config reference, "no_ci").

commands:
  test: ./scripts/gate.sh

# Dependency provisioning, the largest part of a run from nothing, is reused across runs. For each
# run's base commit on the default branch, no-mistakes runs the command once and stores
# lean/.lake/packages: the locked dependency checkouts and their build outputs. A run starts from a
# private copy only while each file below has the same content as at that base, so the copy holds
# the revisions the run's lock files name, built by the same toolchain. Lake then rebuilds whatever
# its traces do not show current, and the script's provisioning builds anything missing. Acorn's own
# modules are compiled in every run. Acorn's own gate tools other than the frame check read their
# outputs in lean/.lake/build without checking them against the sources, and rely on the build that
# precedes them in the run; the frame check asks Lake whether each module it reads is built from
# the present sources. Acorn's verification keeps Lake's artifact cache off.
#
# Memory, measured on 2026-10-28 on a fresh clone with 14 cores, as the summed physical footprint of
# the command's processes sampled every 2 s: provisioning from nothing peaked at 3.1 GiB, and the
# whole Test command at 11.3 GiB, during the Regula audit. Nothing enforces either bound.
build_outputs:
  command: no-mistakes admit --memory 4GiB --limit "none; measured peak 3.1 GiB" -- ./scripts/gate.sh provision
  directories:
    - lean/.lake/packages
  toolchain_files:
    - lean/lean-toolchain
    - lean/lake-manifest.json
    - site/lean-toolchain
    - site/lake-manifest.json

# The Test step builds Acorn and its documents and replays the claimed modules in the kernel.
heavy_steps:
  test:
    memory: 12GiB
    limit: none; measured peak 11.3 GiB

# Pull request descriptions. Acorn squash-merges each pull request, so its description becomes the
# commit message on main, and every description carries the sections the template names: Mission
# accounting, Decisions, Accepted risk and, for a defect fix, Root cause. Without a template, the
# pull request step of every run on an open pull request (after a rebase or a repair, for example)
# redrafts its whole description, dropping what its author wrote there. With one, no-mistakes drafts
# a new pull request's description from the template and refuses one that loses, renames or
# reorders its top-level (`#`) headings. Later runs keep the text outside the generated appendix,
# masking only home-directory paths and control characters in it, and refresh only that appendix
# (no-mistakes' repo-config reference, "pr.template" and "Author-preserving regeneration", and
# internal/pipeline/steps/pr_ownership.go). It reads the template's bytes from the default branch. A
# template that is empty, not UTF-8, holds a NUL byte, exceeds 16 KiB, is a symbolic link or
# contains no-mistakes' own publication markers fails every pull request step. A description an
# earlier run wrote without a template holds that run's evidence outside any appendix; no-mistakes
# updates it only after that evidence is removed by hand.
pr:
  template: .github/pull_request_template.md

# Tests are no evidence here. Acorn establishes a change's claims by proof, construction and
# derivation, never by tests (AGENTS.md, "Correct by construction"). The pipeline's review and test
# agents read this file and no-mistakes' own contracts, not a contributor's instructions, so this
# file is where they learn that rule. `policy: forbid` tells every pipeline agent that a test is no
# evidence and that none may be added. It also makes the pipeline report, at its Test step, each
# line the listing below prints for a change and not for its base, and refuse to publish such a
# line unreported.
#
# The listing prints the tests that Lake, Acorn's build tool, defines. Lake knows one kind of test:
# a package's test driver, the script, executable or library that `lake test` runs, set by the
# package's `testDriver` option or by tagging one target `@[test_driver]` (Lake at Lean v4.36.0:
# `Package.test` in Lake/CLI/Actions.lean, and Lake/Load/Lean/Eval.lean). Every directory with a
# `lakefile.lean` or `lakefile.toml` is a package that `lake test` can run there (`resolveConfigFile`
# in Lake/Load/Package.lean). So the listing loads each directory holding such a file in Git's
# index of the listed snapshot, and prints `{"package":<directory>,"test_driver":<driver>}` for each
# package that configures a driver.
#  - Lake's own `loadPackage` loads each package, as `lake check-test` does, under the toolchain
#    elan selects in its directory. `lake check-test` itself cannot serve: it exits 1 both when the
#    package configures no driver and when it fails to load. The Lean program below runs Lake's
#    compiled code (libLake_shared) and exits non-zero when a package fails to load, so the listing
#    then fails instead of printing an empty or partial list.
#  - Configuration file names match without regard to case, as Lake finds them on a
#    case-insensitive file system. A package path that Git prints quoted (one holding a quote, a
#    backslash or a control character) fails the listing, since the quoted form is not the path.
#  - The program uses Lake's public Lean interface. A toolchain whose Lake changes the signatures it
#    calls makes the listing fail. A change in what `loadPackage` records as a package's test driver
#    is not detected: the listing would then print nothing for that driver and pass.
# A test Lake does not know, such as a command in a Lean file that runs code on chosen inputs, is
# not listed. `forbid` leaves it to the review agent, whom it tells to report every test a change
# adds; that is an instruction an agent follows, not a check.
#
# Memory. Measured on 2026-11-02 with /usr/bin/time -l on a copy of the tracked files, loading the
# lean package peaked at 1.13 GiB of physical footprint and 2.23 GiB resident, and the site package
# at 0.22 GiB and 1.30 GiB. Most of the resident memory is the .olean files Lean maps, which the
# system can drop without swapping. Each load runs through `no-mistakes admit` with a 2 GiB bound,
# which it takes from the share of work already admitted, such as the Test step declared in
# heavy_steps above, or otherwise waits for in the machine's memory budget beside all other admitted
# work. Nothing enforces the bound.
test:
  tests_as_evidence:
    policy: forbid
    list_command: |
      set -eu
      work=$(mktemp -d "$PWD/.test-listing.XXXXXX")
      trap 'rm -rf "$work"' EXIT
      cat > "$work/driver.lean" <<'EOF'
      import Lake.CLI.Main
      open Lake

      /-- Load the Lake package in the working directory as `lake check-test` loads it, and write
      to the output file one JSON line naming the package and its test driver, or nothing when it
      configures none. A package that fails to load exits non-zero. -/
      def main (args : List String) : IO UInt32 := do
        let [pkgPath, out] := args
          | throw <| IO.userError "usage: <package path> <output file>"
        let (elanInstall?, leanInstall?, lakeInstall?) <- findInstall?
        let opts : LakeOptions := {elanInstall?, leanInstall?, lakeInstall?}
        let cfg <- match <- opts.mkLoadConfig.toBaseIO with
          | .ok cfg => pure cfg
          | .error e => throw <| IO.userError (toString e)
        let some pkg <- (loadPackage cfg).toBaseIO {out := .stderr}
          | return 1
        IO.FS.writeFile out <| if pkg.testDriver.isEmpty then "" else
          (Lean.Json.mkObj [("package", .str pkgPath), ("test_driver", .str pkg.testDriver)]).compress ++ "\n"
        return 0
      EOF
      git -c core.quotePath=false ls-files -- ':(glob,icase)**/lakefile.lean' ':(glob,icase)**/lakefile.toml' > "$work/configs"
      while IFS= read -r config; do dirname -- "$config"; done < "$work/configs" | LC_ALL=C sort -u > "$work/packages"
      if [ ! -s "$work/packages" ]; then
        echo "no Lake package configuration is tracked" >&2
        exit 1
      fi
      while IFS= read -r pkg; do
        case $pkg in
          \"*) echo "Git prints the package path $pkg quoted" >&2; exit 1 ;;
        esac
        if ! (
          cd "$pkg" &&
          prefix=$(lean --print-prefix) &&
          lib=$prefix/lib/lean/libLake_shared.dylib &&
          { [ -e "$lib" ] || lib=$prefix/lib/lean/libLake_shared.so; } &&
          no-mistakes admit --memory 2GiB --limit "none; measured peak 1.13 GiB footprint, 2.23 GiB resident" -- \
            lean --load-dynlib="$lib" --run "$work/driver.lean" "$pkg" "$work/driver"
        ) >&2; then
          echo "Lake could not report the test driver of package $pkg" >&2
          exit 1
        fi
        cat "$work/driver"
        rm "$work/driver"
      done < "$work/packages"

  # A `no-surface` verdict says that no claim of a change needs execution against a running
  # product. By default it parks the Test step to ask whether to proceed without live validation.
  # Here it completes the step: for a proof or document change that verdict is the normal result,
  # and the question guards against something cheap to undo, since a run of Acorn's programs is a
  # smoke test and never acceptance evidence (CONTRIBUTING.md), and every claim stays listed on the
  # pull request.
  #
  # no-mistakes documents `proceed` as a repository's declaration that it has no running product to
  # drive, and says so to the step's agent in a fixed line of its prompt (`testClaimParkingRules`
  # in internal/pipeline/steps/test_claims.go). That declaration is not true of Acorn, which has a
  # viewer and native hosts that can be run. Here `proceed` decides only what a `no-surface` verdict
  # does; `no-go`, `inconclusive` and the refusal of a `pass` or `fail` claim under `no-surface`
  # stay as they are. The runbook below reaches the agent's evidence prompt in its "Context"
  # section, ahead of that line (`trustedTestInstructionsSection` in
  # internal/pipeline/steps/test.go), so it corrects the line in advance and says which changes have
  # a surface. no-mistakes keeps the line breaks of the runbook and collapses the white space within
  # each line. It reads both settings only from the copy on the default branch. Nothing checks the
  # agent's judgment of a change: one with a surface that it judges to have none lands undriven, an
  # accepted risk for the reason above.
  #
  # The runbook is also where the step's agent learns the owner's rule on runs of Acorn's agent, and
  # it holds the closed list: the exact invocations of Acorn's executables that a step may drive
  # without the owner's authorization. AGENTS.md, CONTRIBUTING.md, the skills and the documents point
  # here. The list is policy. Each entry was admitted by reading its source, and every other
  # invocation needs the owner's authorization whether or not it would step a learner: the runbook
  # says nothing about what an unlisted invocation does. A description of which commands step would
  # have to be right for every command line there is, and a reading of an argument reader is easy to
  # get wrong (Acorn's reader skips a word that does not begin with two dashes, so a help flag such as
  # -h refuses nothing); a closed list says nothing false of an invocation it does not name. So some
  # invocations that would step nothing are left off, as policy, and a step does not decide an
  # unlisted invocation for itself during a run: an invocation is added by a reviewed change to this
  # file once its source has been read. The pipeline reads this runbook from the default branch, and a
  # step drives the program built from the head under validation, so the runbook has a step read an
  # entry's source again at that head where the change touches it. Nothing compares the list with
  # lean/lakefile.lean, and nothing checks that the second reading is made. The rule is an instruction
  # that an agent follows, not a refusal in a program. That is an accepted risk, to be closed in code
  # if it fails again. The runbook's sentence on files that an earlier run left is an instruction too,
  # with no mechanism behind it. Its line is admission, not place: it covers every file that a run of
  # the agent or a learner produced unless that file is tracked at the commit under validation,
  # wherever the file sits. One file more is exempt: a file that the change's intent names exactly as
  # supplied by the owner for inspection, with the owner's authorization. Nothing checks that the
  # named file is the one the owner meant; a wrong file read is disclosed in the pull request's
  # description like any computation, which is an accepted risk. A step cannot always tell whether an
  # untracked file came from such a run, and where it cannot it does not open the file and says so,
  # which is an accepted risk too. The gate, the build and the audit tools can find their files by
  # listing directories of the working copy, tracked or not: the corpus audit opens the regular files
  # it finds, which https://github.com/rbeauchamp/acorn/issues/317 tracks, and the frame check reads
  # every file ending in .frame in its directory. That is the programs' behaviour, which these
  # instructions do not change. Until it is changed the instruction is the interim barrier: the
  # runbook tells a step to run them only in a checkout whose untracked files are a build's or the
  # step's own. The pipeline gives this runbook to the Test step's evidence turn and not to its repair
  # rounds, so AGENTS.md and CONTRIBUTING.md point to that paragraph, where a repair agent reads.
  no_surface: proceed
  instructions: |
    A later line of these instructions says that this repository declares it has no running product to drive. That line is no-mistakes' fixed wording for the setting test.no_surface: proceed. It is not true of Acorn, which has programs that a person or a world runs. Here the setting decides only that a no-surface verdict does not park. Judge each change by what follows.

    The programs. The lean_exe declarations in lean/lakefile.lean are the complete list, and each one's root module sorts it. A program rooted under AcornTools is an audit or build tool of the merge gate. Every other program serves a person or a world: for example acorn-viewer with its core acorn-core, microduck-host and the native command-line consumers. scripts/start.sh launches the viewer, and viewer/static and lean/os hold parts of those programs.

    The rule on learners. No step of this run starts a program that steps Acorn's agent or one of its learners over percepts unless the owner's authorization for that run is stated in the change's intent. The owner of Acorn ruled this on 2026-11-19 of every run of the agent or a learner, whatever it is for and by whatever means it is made; CONTRIBUTING.md, "What counts as a run", defines a run. The name given to a run changes nothing: a smoke test, a sanity check, a demonstration, a screenshot or a look at a page is a run of a learner when the program it starts steps one. The rule is applied through the closed list below: a step drives an Acorn executable only by an invocation on that list, and every other invocation needs the owner's authorization for that run, whether or not it would step a learner. Where the intent states no such authorization, a claim that cannot be shown by a listed drive is reported open with that reason and is not driven. The listed drives stay available and are still asked for when a change has a surface, and a drive that is not listed stays available on the owner's authorization, for what that authorization names or points to and no more.

    A change has a surface when it alters what one of those programs does, accepts, prints, renders or writes when it runs. Its verdict is go, no-go or inconclusive, never no-surface, even when proofs settle most of its claims. Proofs and the gate settle what they state. Derive a runtime claim for what they do not reach, such as the compiled program's arguments, files, sockets, process lifetime, output or rendering, and drive that claim, as the directions below allow.

    A change has no surface when it leaves the behaviour of all those programs as it was: proofs and other modules that no such program executes, documents, comments, the audit tools, the gate and this configuration. The gate's result, derivation or reading settle its claims, so run no program for it and return no-surface. The build embeds a digest of every Lean and C source in the native entry points, so any such edit changes that digest; that alone is not a surface.

    The closed list. The lines below are the complete list of the invocations of Acorn's executables that a step may drive without the owner's authorization. An Acorn executable is a program that lean/lakefile.lean declares, and the scripts and commands that run those programs count with them: scripts/start.sh, scripts/gate.sh, scripts/verify.sh, scripts/regula.sh, and ./scripts/lean.sh exe or lake exe followed by a program's name. The list is policy. Each entry is written out exactly, token for token, and an invocation that is not written here needs the owner's authorization, stated in the change's intent, whether or not it would step a learner. The list says nothing about what an unlisted invocation does: being left off is no statement that an invocation steps a learner, and some invocations are left off that would, by their source, step nothing. They are left off as policy, to keep the list closed and exact. Such a drive is not forbidden for ever: it is made on the owner's authorization, or it is added here by a reviewed change to this runbook once its source has been read. A step does not decide an unlisted invocation for itself during a run. A spelling that differs from an entry in one character is another invocation, and so is asking a program for help. A step never follows a program's printed advice to run another command without first finding that command on this list.

    What admits an entry. Each entry is on the list because its source shows that it steps neither Acorn's agent nor a learner. That reading was made on the default branch, where the pipeline reads this runbook, and a step drives the program built from the head under validation. So before driving an entry a step looks at the change under validation: where it touches the entry's program, its entry point or anything the entry point calls, the step reads at that head that the invocation still takes no step, and until that reading is made the entry is not driven and its claim is reported open. Admitted means that the invocation takes no step, and nothing more: the paragraphs below on the viewer, on scripts/start.sh, on files that an earlier run left and on the machine bind a listed drive like any other.

    Authorization. One sentence governs this runbook's directions on driving an invocation that is not on the list, and on the states that such a run supplies: each only, each never, each limit to the listed invocations and each instruction to report a claim open, where it is about such a drive, binds a run whose intent states no authorization for it, and where the change's intent states the owner's authorization, exactly what that authorization names or points to may be started and the states it supplies inspected, and nothing wider. An authorization covers what the owner's authorization names or points to, such as the written schedule of a registered study's protocol under docs/studies. An agent never extends it by likeness to an invocation it does not name, and no agent's intent or instruction creates or widens one. The sentence reaches nothing else. The paragraph on the machine's own services and on stopping only a process this run started binds every run whatever its intent says, and so does the admission of memory through no-mistakes admit; the paragraph on files that an earlier run left states its own condition, and so does the paragraph on scripts/start.sh. A run that the owner authorized keeps its files in the directory that its authorization names; every other drive, and an authorized run whose authorization names no directory, keeps its files in a fresh temporary directory outside the checkout.

    Listed, the programs that serve a person or a world. Each is run as the built program lean/.lake/build/bin/NAME, by its path, with exactly the arguments written and with a fresh empty directory outside the checkout as its working directory; for the viewer's recipe that directory is DIR. Four of these entries are always reported as computations on the agent, as "Driving a program" says: acorn-core demo --research-profile ranked --goals 0, the ten-word agent-native line, the checkpoint-native lines with save, load and resume, and swifttd-native 0.
    acorn-viewer with no argument at all. acorn-viewer --cmd false --run-dir DIR --port 0 --control-stdin, under every condition of "Driving the viewer" below.
    acorn-core demo. acorn-core demo --research-profile ranked --goals 0. acorn-core visits --research-profile ranked --comparator --visits 1 --steps 1 --target-x 0 --target-y 0.
    microduck-host with no argument at all.
    agent-native with no argument at all. agent-native 1 3 1 1 final per-step declared learned discounted expectation, ten words and no eleventh.
    checkpoint-native with no argument at all. checkpoint-native save FILE 1 3 1 1 final per-step declared learned discounted expectation, and after it the same line with load or with resume in place of save, where FILE is the path of a file that this step itself creates by that save in its fresh temporary directory.
    swifttd-native 0. control-native 0. temporal-native 0. feature-native 0.
    world-native with no argument at all. world-native actions 1 64. world-native terrain 0 0 1 0. world-certificates with no argument at all. browser-kernel with no argument at all.
    Listed, the gate, the build and the audit tools. ./scripts/gate.sh. ./scripts/verify.sh with no argument at all, ./scripts/verify.sh build-executing, ./scripts/verify.sh site and ./scripts/verify.sh site write. acorn-gates with no argument at all, acorn-gates build-executing, acorn-gates site and acorn-gates site write. ./scripts/regula.sh. ./scripts/lean.sh build NAME, where NAME is a target of lean/lakefile.lean. lean-boundary-audit source, lean-boundary-audit compiled and lean-boundary-audit proof-source. native-audit with no argument at all. ownership-audit source, ownership-audit compiled and ownership-audit complete. corpus-audit with no argument at all and corpus-audit documents. theorem-count with no argument at all. intent-check with no argument at all. frame-check with no argument at all. A program of this group can find its files by listing directories of the working copy, tracked or not, so each of these entries, run on its own or through another entry that calls it, has the condition that the paragraph on files that an earlier run left states.
    Listed, the launcher. ./scripts/start.sh --help. ./scripts/start.sh --prepare-only. Listing them gives no leave to run the launcher: the paragraph on scripts/start.sh below says for which changes a step runs it, and what a step reads before an invocation that, like --prepare-only, reaches the launcher's preparation, which can install.
    A run made inside Lean or by a re-implementation falls under the rule as a run of a program does; CONTRIBUTING.md, "What counts as a run", says which computations inside Lean are runs and which are proof search.

    Driving a program. Run the built program itself, for the smallest run that shows the claim, and use only an invocation on the closed list. A passing gate leaves every program under lean/.lake/build/bin. Build a missing one with no-mistakes admit --memory 12GiB --limit "none; the Test command's measured peak 11.3 GiB" -- ./scripts/lean.sh build NAME, and run any other job that may use more than about 2 GiB through no-mistakes admit with its declared peak. Keep every drive's files in a fresh temporary directory outside the checkout; the one exception is an authorized run whose authorization names its directory. Report each drive in which the agent or a learner was built, one that stepped nothing included, with what it computed and what it showed, so that the pull request can list it as a computation on the agent (CONTRIBUTING.md, "What counts as a run"). A drive that built neither, such as a refused command line, a usage text or the comparator, is not such a computation and is not listed as one.

    Driving the viewer. The closed list holds two invocations of acorn-viewer: with no argument at all, and the recipe of this paragraph. Every other start of the viewer needs the owner's authorization. The recipe answers what a Test step found on 2026-11-21: a viewer started with no state.json in its run directory starts in the running state, and its supervisor then launches its child, which under --research-profile ranked is the core. The recipe has two parts. First, a child command that cannot be a core: give --cmd false and no --research-profile, so that the only process its supervisor can start is /bin/sh -c "exec false". Second, an explicitly stopped state: make a fresh empty directory, and before starting the viewer write into it a file named state.json that holds the one line {"seed":1,"desired":"stopped","run_id":"0000000000000001","agent_epoch":0,"origin":"fresh","process_started":false}, which is the text that PersistedState.encode in lean/Acorn/Host/Viewer/PersistedState.lean gives for a stopped run that has started no process. The stopped state keeps the supervisor from starting any process until a Start is asked for, and the recipe gives no --start; the child command is what makes a Start harmless, since the process it starts is the command false and not a core. Then, with that directory as the working directory and DIR its path, run exactly acorn-viewer --cmd false --run-dir DIR --port 0 --control-stdin, with no --start and no --open-browser. The working directory matters because the viewer moves a file named acorn-weights.ckpt from its working directory into the run directory when it finds one. Stop the viewer by writing the line stop to its standard input, which must stay open until then; for --control-stdin the viewer itself starts one helper process, /bin/cat, which relays that input. A viewer that refuses the state file exits with status 1 before it serves anything: report that, and never start it without the file. This recipe serves the built page in its stopped state, which shows the page's text, layout, controls and stopped lifecycle. In a viewer started by this recipe the page's Start button may be pressed: the only process the supervisor can start is the command false, whose exit exercises the lifecycle and its handling of a failed child; one press starts that command more than once, since the supervisor restarts it until its restart budget is used. That is safe because of the child command, so never press Start in a viewer started in any other way. The page receives the viewer's own control frames, which carry the lifecycle, and no telemetry from a core, since none runs: the recipe shows no panel fed by a core's frames, and no earlier map or checkpoint, since its fresh directory holds none. Report a claim about a state that only a running core supplies open. Open the served page in a fresh browser profile, which starts with empty storage, and leave any existing profile as it is: the page restores a map and a trail from the browser's storage, kept by address and port, so an earlier visit to the same address could put an earlier run's data into the capture. A private window is not enough, since it shares the storage of a private session that is already open. A start of the viewer that the owner has authorized has a precondition that follows from what the viewer does when it starts: it moves a file named acorn-weights.ckpt from its working directory into its run directory when that holds no checkpoint, it reads state.json and explored.map from its run directory, its core loads weights.ckpt from there, and it appends the core's log to core.log there, renaming that file to core.log.1 when it is full (initialState in lean/NativeApp/Viewer.lean; Supervisor.new in lean/Acorn/Host/Viewer/Supervisor.lean; adoptStrayCheckpoint and appendLog in lean/Acorn/Host/Viewer/RunDirectory.lean). Its run directory is the one that --run-dir names, and acorn-run in its working directory when none is given. So before an authorized start, by the launcher or directly, the viewer's working directory holds no acorn-weights.ckpt unless the authorization names that file, and its run directory holds none of the files a run keeps there, which are state.json, explored.map, weights.ckpt, core.log and core.log.1, with two exceptions: a file that this step itself wrote in this run, such as a stopped state.json it prepared, and a file that the authorization covers as input, which is a file it names, or a file in a directory that it names as holding the earlier run that this run is to resume. An authorization that names a directory only as the place where a new run writes covers no file found there: a new run starts in a directory that holds none of those files. A file that the step found there is not its own. The second exception covers files that are themselves in the named directory. The viewer resolves a run directory that is a symbolic link, and it and its core open state.json, explored.map, weights.ckpt and core.log by path, which follows a symbolic link (RunDirectory.open, openRead and appendLog in lean/Acorn/Host/Viewer/RunDirectory.lean; readBounded in lean/Acorn/Host/Checkpoint/IO.lean). So where the named directory or one of the run's files in it is a symbolic link, the step does not start the viewer and reports the path, unless the authorization names the link's target. A step that finds any other such file does not start the viewer, moves nothing, and reports the path. An authorized start is made without --open-browser, and by the launcher with --no-browser, and its page is read in a fresh browser profile, so that the system browser, whose storage may hold an earlier run's map for the same address, is not opened, unless the authorization names the browser.

    scripts/start.sh can install system packages, and its launch is not on the closed list. A step runs the launcher only for a change to the script itself, or as a launch that the owner has authorized. Its preparation, which comes before its build and before any launch, can install. So a step runs an invocation of the launcher that reaches the preparation, in whatever mode, --prepare-only and a launch that the owner has authorized included, only after reading in scripts/start.sh itself that this invocation would install nothing here; where it would install anything, the step does not run it and reports that. ./scripts/start.sh --help stops before the preparation. The paragraph on the machine binds this check whatever the intent says, and the check permits nothing: which invocations may be run at all is decided by the sentence above on when a step runs the launcher, by the closed list and by the rule on learners. For a change to the script itself, drive ./scripts/start.sh --help, or ./scripts/start.sh --prepare-only after that reading, and report a claim about its launch open. After its build under --prepare-only the script prints what the launcher is for, and after a failure it says to run the same command again with the same options: neither is a reason to run the launcher in another mode. A launch by the launcher that the owner has authorized is a start of the viewer, and the precondition that "Driving the viewer" states applies to it: the launcher changes to the repository root, which is then the viewer's working directory, and its run directory is acorn-run there unless --run-dir names another. microduck-host requires its --control and --depth sockets from the simulator's daemons, and the simulator is not in this repository. When what a claim needs cannot be stood up as a disposable process of this run, or cannot be shown by a listed drive, report the claim open with that reason.

    Files that an earlier run left. What a run of Acorn's agent or a learner produced without the owner's authorization is evidence of nothing and is used for nothing: a validation step neither opens nor cites a log, checkpoint, state file, screenshot or other file produced by a run of Acorn's agent or a learner that the owner did not authorize for the change under validation, and where it meets one it reports the path and leaves the file as it is. The line is drawn by admission, not by place: the sentence covers every such file unless it is tracked in the repository at the commit under validation. A tracked file was admitted by review, such as the records of registered studies under docs/studies, and is read like any other tracked file; every other such file is covered wherever it sits, inside the checkout or outside it, a run directory or an evidence directory left inside a working copy included. One more file is exempt beside tracked ones: a file that the change's intent names, exactly, as supplied by the owner for inspection, with the owner's authorization stated in the owner's words or by a pointer to where they are recorded; an intent written by an agent cannot create the exemption on its own word. The exemption covers reading that one file and nothing wider: the file is not moved, nothing is resumed or stepped from it, and the exemption reaches no other file of the same run and no file found beside it. A step that finds the file it opened under the exemption was not the one the intent names reports the path and that it was read, so that the pull request's description discloses it. A step runs an entry of the closed list's group on the gate, the build and the audit tools, on its own or through another entry that calls it, only in a checkout where every file that is not tracked at the commit under validation is an output of a build of that checkout or a file this step itself wrote: a program of that group can find its files by listing directories of the working copy, and does not ask which of them are tracked. Where the checkout holds any other untracked file, the step uses a clean checkout of the same commit and leaves the first checkout as it is, deleting nothing and moving nothing. The merge gate's own outputs, the outputs of proofs and this step's own capture of a stopped viewer are not files that a learner run produced. Where a step cannot tell whether an untracked file came from such a run, it does not open the file and says so.

    The machine. Start, stop, reconfigure or reset none of the machine's own services that this run did not create: a container runtime or virtual machine, a system daemon, a package manager's global state or a shared database. Stop only a process this run started, by the process id recorded when it started, never by matching a name or command line.

    What a run shows. A live result here is a smoke test: this run of this program did the one observable thing the claim names (CONTRIBUTING.md). It is never acceptance evidence, and it settles no claim that the agent learns, achieves a goal or meets a theorem; those belong to proofs and to registered studies, so report such a claim from its proof or as open. Do not sweep seeds, compare scores, tune anything, rerun learning or promote a default (AGENTS.md). Being a smoke test gives no leave to start a learner: the rule on learners decides what may be started.
