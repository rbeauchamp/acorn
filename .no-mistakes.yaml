# Configuration of the no-mistakes pipeline, which validates every change to Acorn before it
# reaches GitHub. no-mistakes reads every setting below only from the copy of this file on the
# default branch, so a change to it governs the runs that follow its merge, not its own.
#
# The pipeline's Test step runs scripts/gate.sh, Acorn's merge gate, in a checkout of the exact
# commit it validates, holding only tracked files. The script provisions the pinned dependencies
# and runs every merge check: both stages of ./scripts/verify.sh, the Regula audit
# ./scripts/regula.sh, lean-intent's confirmation and implementation checks
# (lean/AcornTools/Intent.lean), and the check of each target's pinned frame
# (lean/AcornTools/Frame.lean). Any failing check fails the step.
#
# GitHub runs the same script on a pull request's head commit at each event that gives the pull
# request its head (.github/workflows/verify.yml). This file sets no `no_ci`, the declaration that a
# repository has no checks on its forge, so the pipeline expects them: once it has opened a pull
# request it reports the pull request ready only when every check that GitHub registers on the
# pull request's head commit has passed, and never while GitHub registers none there
# (no-mistakes' repo-config reference, "no_ci").

commands:
  test: ./scripts/gate.sh

# Dependency provisioning, the largest part of a run from nothing, is reused across runs. For each
# run's base commit on the default branch, no-mistakes runs the command once and stores
# lean/.lake/packages: the locked dependency checkouts and their build outputs. A run starts from a
# private copy only while each file below has the same content as at that base, so the copy holds
# the revisions the run's lock files name, built by the same toolchain. Lake then rebuilds whatever
# its traces do not show current, and the script's provisioning builds anything missing. Acorn's own
# modules are compiled in every run. Acorn's own gate tools other than the frame check read their
# outputs in lean/.lake/build without checking them against the sources, and rely on the build that
# precedes them in the run; the frame check asks Lake whether each module it reads is built from
# the present sources. Acorn's verification keeps Lake's artifact cache off.
#
# Memory, measured on 2026-10-28 on a fresh clone with 14 cores, as the summed physical footprint of
# the command's processes sampled every 2 s: provisioning from nothing peaked at 3.1 GiB, and the
# whole Test command at 11.3 GiB, during the Regula audit. Nothing enforces either bound.
build_outputs:
  command: no-mistakes admit --memory 4GiB --limit "none; measured peak 3.1 GiB" -- ./scripts/gate.sh provision
  directories:
    - lean/.lake/packages
  toolchain_files:
    - lean/lean-toolchain
    - lean/lake-manifest.json
    - site/lean-toolchain
    - site/lake-manifest.json

# The Test step builds Acorn and its documents and replays the claimed modules in the kernel.
heavy_steps:
  test:
    memory: 12GiB
    limit: none; measured peak 11.3 GiB

# Pull request descriptions. Acorn squash-merges each pull request, so its description becomes the
# commit message on main, and every description carries the sections the template names: Mission
# accounting, Decisions, Accepted risk and, for a defect fix, Root cause. Without a template, the
# pull request step of every run on an open pull request (after a rebase or a repair, for example)
# redrafts its whole description, dropping what its author wrote there. With one, no-mistakes drafts
# a new pull request's description from the template and refuses one that loses, renames or
# reorders its top-level (`#`) headings. Later runs keep the text outside the generated appendix,
# masking only home-directory paths and control characters in it, and refresh only that appendix
# (no-mistakes' repo-config reference, "pr.template" and "Author-preserving regeneration", and
# internal/pipeline/steps/pr_ownership.go). It reads the template's bytes from the default branch. A
# template that is empty, not UTF-8, holds a NUL byte, exceeds 16 KiB, is a symbolic link or
# contains no-mistakes' own publication markers fails every pull request step. A description an
# earlier run wrote without a template holds that run's evidence outside any appendix; no-mistakes
# updates it only after that evidence is removed by hand.
pr:
  template: .github/pull_request_template.md

# Tests are no evidence here. Acorn establishes a change's claims by proof, construction and
# derivation, never by tests (AGENTS.md, "Correct by construction"). The pipeline's review and test
# agents read this file and no-mistakes' own contracts, not a contributor's instructions, so this
# file is where they learn that rule. `policy: forbid` tells every pipeline agent that a test is no
# evidence and that none may be added. It also makes the pipeline report, at its Test step, each
# line the listing below prints for a change and not for its base, and refuse to publish such a
# line unreported.
#
# The listing prints the tests that Lake, Acorn's build tool, defines. Lake knows one kind of test:
# a package's test driver, the script, executable or library that `lake test` runs, set by the
# package's `testDriver` option or by tagging one target `@[test_driver]` (Lake at Lean v4.35.0:
# `Package.test` in Lake/CLI/Actions.lean, and Lake/Load/Lean/Eval.lean). Every directory with a
# `lakefile.lean` or `lakefile.toml` is a package that `lake test` can run there (`resolveConfigFile`
# in Lake/Load/Package.lean). So the listing loads each directory holding such a file in Git's
# index of the listed snapshot, and prints `{"package":<directory>,"test_driver":<driver>}` for each
# package that configures a driver.
#  - Lake's own `loadPackage` loads each package, as `lake check-test` does, under the toolchain
#    elan selects in its directory. `lake check-test` itself cannot serve: it exits 1 both when the
#    package configures no driver and when it fails to load. The Lean program below runs Lake's
#    compiled code (libLake_shared) and exits non-zero when a package fails to load, so the listing
#    then fails instead of printing an empty or partial list.
#  - Configuration file names match without regard to case, as Lake finds them on a
#    case-insensitive file system. A package path that Git prints quoted (one holding a quote, a
#    backslash or a control character) fails the listing, since the quoted form is not the path.
#  - The program uses Lake's public Lean interface. A toolchain whose Lake changes the signatures it
#    calls makes the listing fail. A change in what `loadPackage` records as a package's test driver
#    is not detected: the listing would then print nothing for that driver and pass.
# A test Lake does not know, such as a command in a Lean file that runs code on chosen inputs, is
# not listed. `forbid` leaves it to the review agent, whom it tells to report every test a change
# adds; that is an instruction an agent follows, not a check.
#
# Memory. Measured on 2026-11-02 with /usr/bin/time -l on a copy of the tracked files, loading the
# lean package peaked at 1.13 GiB of physical footprint and 2.23 GiB resident, and the site package
# at 0.22 GiB and 1.30 GiB. Most of the resident memory is the .olean files Lean maps, which the
# system can drop without swapping. Each load runs through `no-mistakes admit` with a 2 GiB bound,
# which it takes from the share of work already admitted, such as the Test step declared in
# heavy_steps above, or otherwise waits for in the machine's memory budget beside all other admitted
# work. Nothing enforces the bound.
test:
  tests_as_evidence:
    policy: forbid
    list_command: |
      set -eu
      work=$(mktemp -d "$PWD/.test-listing.XXXXXX")
      trap 'rm -rf "$work"' EXIT
      cat > "$work/driver.lean" <<'EOF'
      import Lake.CLI.Main
      open Lake

      /-- Load the Lake package in the working directory as `lake check-test` loads it, and write
      to the output file one JSON line naming the package and its test driver, or nothing when it
      configures none. A package that fails to load exits non-zero. -/
      def main (args : List String) : IO UInt32 := do
        let [pkgPath, out] := args
          | throw <| IO.userError "usage: <package path> <output file>"
        let (elanInstall?, leanInstall?, lakeInstall?) <- findInstall?
        let opts : LakeOptions := {elanInstall?, leanInstall?, lakeInstall?}
        let cfg <- match <- opts.mkLoadConfig.toBaseIO with
          | .ok cfg => pure cfg
          | .error e => throw <| IO.userError (toString e)
        let some pkg <- (loadPackage cfg).toBaseIO {out := .stderr}
          | return 1
        IO.FS.writeFile out <| if pkg.testDriver.isEmpty then "" else
          (Lean.Json.mkObj [("package", .str pkgPath), ("test_driver", .str pkg.testDriver)]).compress ++ "\n"
        return 0
      EOF
      git -c core.quotePath=false ls-files -- ':(glob,icase)**/lakefile.lean' ':(glob,icase)**/lakefile.toml' > "$work/configs"
      while IFS= read -r config; do dirname -- "$config"; done < "$work/configs" | LC_ALL=C sort -u > "$work/packages"
      if [ ! -s "$work/packages" ]; then
        echo "no Lake package configuration is tracked" >&2
        exit 1
      fi
      while IFS= read -r pkg; do
        case $pkg in
          \"*) echo "Git prints the package path $pkg quoted" >&2; exit 1 ;;
        esac
        if ! (
          cd "$pkg" &&
          prefix=$(lean --print-prefix) &&
          lib=$prefix/lib/lean/libLake_shared.dylib &&
          { [ -e "$lib" ] || lib=$prefix/lib/lean/libLake_shared.so; } &&
          no-mistakes admit --memory 2GiB --limit "none; measured peak 1.13 GiB footprint, 2.23 GiB resident" -- \
            lean --load-dynlib="$lib" --run "$work/driver.lean" "$pkg" "$work/driver"
        ) >&2; then
          echo "Lake could not report the test driver of package $pkg" >&2
          exit 1
        fi
        cat "$work/driver"
        rm "$work/driver"
      done < "$work/packages"

  # A `no-surface` verdict says that no claim of a change needs execution against a running
  # product. By default it parks the Test step to ask whether to proceed without live validation.
  # Here it completes the step: for a proof or document change that verdict is the normal result,
  # and the question guards against something cheap to undo, since a run of Acorn's programs is a
  # smoke test and never acceptance evidence (CONTRIBUTING.md), and every claim stays listed on the
  # pull request.
  #
  # no-mistakes documents `proceed` as a repository's declaration that it has no running product to
  # drive, and says so to the step's agent in a fixed line of its prompt (`testClaimParkingRules`
  # in internal/pipeline/steps/test_claims.go). That declaration is not true of Acorn, which has a
  # viewer and native hosts that can be run. Here `proceed` decides only what a `no-surface` verdict
  # does; `no-go`, `inconclusive` and the refusal of a `pass` or `fail` claim under `no-surface`
  # stay as they are. The runbook below reaches the agent's evidence prompt in its "Context"
  # section, ahead of that line (`trustedTestInstructionsSection` in
  # internal/pipeline/steps/test.go), so it corrects the line in advance and says which changes have
  # a surface. no-mistakes keeps the line breaks of the runbook and collapses the white space within
  # each line. It reads both settings only from the copy on the default branch. Nothing checks the
  # agent's judgment of a change: one with a surface that it judges to have none lands undriven, an
  # accepted risk for the reason above.
  #
  # The runbook is also where the step's agent learns the owner's rule on runs of Acorn's agent and
  # which programs step a learner: it is the one place that says so for each executable, and
  # AGENTS.md, CONTRIBUTING.md, the skills and the documents point here. Each line on a program is
  # read from that program's source, and each invocation it calls safe is written out token for
  # token, or as a family whose criterion is written out token by token where the source
  # establishes the whole family. The list is a closed allowlist: the runbook treats an Acorn
  # program it does not name, and an invocation that no line covers, as stepping a learner. A
  # reading of an argument reader is easy to get wrong (Acorn's reader skips a word that does not
  # begin with two dashes, so a help flag such as -h refuses nothing), so a step does not decide an
  # uncovered invocation for itself during a run: a drive established to step nothing is added by a
  # reviewed change to this file. Not on the list means not yet shown, never forbidden for ever.
  # Nothing compares the list with lean/lakefile.lean. The rule is an instruction that an agent
  # follows, not a refusal in a program: the viewer, given --research-profile ranked and no state
  # file, still starts a core. That is an accepted risk, to be closed in code if it fails again.
  # The runbook's sentence on files that an earlier run left is an instruction too, with no
  # mechanism behind it. Its line is admission, not place: it covers every file that a run of the
  # agent or a learner produced unless that file is tracked at the commit under validation,
  # wherever the file sits. One file more is exempt: a file that the change's intent names exactly
  # as supplied by the owner for inspection, with the owner's authorization. Nothing checks that
  # the named file is the one the owner meant; a wrong file read is disclosed in the pull request's
  # description like any computation, which is an accepted risk. A step cannot always tell whether
  # an untracked file came from such a run, and where it cannot it does not open the file and says
  # so, which is an accepted risk too. The pipeline gives this runbook to the Test step's evidence
  # turn and not to its repair rounds, so AGENTS.md and CONTRIBUTING.md point to that paragraph,
  # where a repair agent reads.
  no_surface: proceed
  instructions: |
    A later line of these instructions says that this repository declares it has no running product to drive. That line is no-mistakes' fixed wording for the setting test.no_surface: proceed. It is not true of Acorn, which has programs that a person or a world runs. Here the setting decides only that a no-surface verdict does not park. Judge each change by what follows.

    The programs. The lean_exe declarations in lean/lakefile.lean are the complete list, and each one's root module sorts it. A program rooted under AcornTools is an audit or build tool of the merge gate. Every other program serves a person or a world: for example acorn-viewer with its core acorn-core, microduck-host and the native command-line consumers. scripts/start.sh launches the viewer, and viewer/static and lean/os hold parts of those programs.

    The rule on learners. No step of this run starts a program that steps Acorn's agent or one of its learners over percepts unless the owner's authorization for that run is stated in the change's intent. The owner of Acorn ruled this on 2026-11-19 of every run of the agent or a learner, whatever it is for and by whatever means it is made; CONTRIBUTING.md, "What counts as a run", defines a run. The name given to a run changes nothing: a smoke test, a sanity check, a demonstration, a screenshot or a look at a page is a run of a learner when the program it starts steps one. So a smoke test in which the core runs its agent is a run of a learner, and a smoke test of the viewer started in any way but the one that "Driving the viewer" gives is treated as one. A claim that cannot be shown without stepping a learner is reported open with that reason, never driven. The rule forbids no other drive. The drives below that step no learner stay available and are still asked for when a change has a surface, and a drive that steps a learner stays available on that authorization, for the run it names and no more.

    A change has a surface when it alters what one of those programs does, accepts, prints, renders or writes when it runs. Its verdict is go, no-go or inconclusive, never no-surface, even when proofs settle most of its claims. Proofs and the gate settle what they state. Derive a runtime claim for what they do not reach, such as the compiled program's arguments, files, sockets, process lifetime, output or rendering, and drive that claim, as the directions below allow.

    A change has no surface when it leaves the behaviour of all those programs as it was: proofs and other modules that no such program executes, documents, comments, the audit tools, the gate and this configuration. The gate's result, derivation or reading settle its claims, so run no program for it and return no-surface. The build embeds a digest of every Lean and C source in the native entry points, so any such edit changes that digest; that alone is not a surface.

    Which programs step a learner. One sentence on authorization governs this runbook's directions on starting a program that steps Acorn's agent or a learner, and on the states that such a run supplies: each only, each never, each limit to the invocations that a line calls safe and each instruction to report a claim open, where it is about such a run, binds a run whose intent states no authorization for it, and where the change's intent states the owner's authorization for a particular run, exactly that run may be started and the states it supplies inspected, and nothing wider. An invocation that this list does not cover counts as such a run, so the owner's authorization for exactly that invocation, written out in the change's intent, allows it; an authorization names one invocation, never a kind of invocation. The sentence reaches nothing else. The paragraph on the machine's own services and on stopping only a process this run started binds every run whatever its intent says, and so do the admission of memory through no-mistakes admit and the fresh temporary directory for a run's files; the paragraph on files that an earlier run left states its own condition. Each line below is read from the program's source. An invocation it calls safe is written out exactly, token for token, as it was traced through that program's own argument reader, or it is a family whose criterion is written out so that an invocation can be checked against it token by token. The programs are every lean_exe of lean/lakefile.lean; site/lakefile.toml declares none. The list is closed: an Acorn program that has no line here, and an invocation that its line does not cover, is treated as stepping a learner. That means not yet shown, never forbidden for ever: a drive established to step nothing is added here by a reviewed change to this runbook, and a step does not decide an uncovered invocation for itself during a run. Asking a program for help is itself an invocation, safe only where its line says so: Acorn's argument reader refuses an unknown word only when it begins with two dashes and skips any other word, so acorn-core audit -h runs the audit. A step never follows a program's printed advice to run another command without first finding that command's line here.
    acorn-viewer steps nothing itself. Its supervisor starts one child process, which under --research-profile ranked is the core, acorn-core. Started with no state.json in its run directory, the viewer starts in the running state and its supervisor launches that child at once, with no --start (initialState in lean/NativeApp/Viewer.lean; Lifecycle.reserve in lean/Acorn/Host/Viewer/Lifecycle.lean). --start, a state.json whose desired is running, and the page's Start button launch it too. Safe: acorn-viewer with no argument at all, which is refused with the usage before anything is opened; and the invocation that "Driving the viewer" writes out.
    acorn-core runs the agent on demo, on audit, and on visits without the comparator. Safe, each exactly as written: acorn-core demo, which is refused because it names no research profile; and acorn-core demo --research-profile ranked --goals 0, an empty finite campaign, in which the agent is built and never stepped. Safe as a family: every acorn-core command line whose first argument is exactly visits and one of whose arguments is exactly the token --comparator, with two dashes, whatever its other options and values. Such a line is either refused or runs the random-policy comparator, whose whole state is a random stream and which builds no agent; an example is acorn-core visits --research-profile ranked --comparator --visits 1 --steps 1 --target-x 0 --target-y 0. A near miss is outside the family and runs the agent: comparator or -comparator is skipped by the argument reader and leaves a plain visits command. world-native admit COMMAND FLAGS applies the same routing of a command and the same admission of a demo command line (Cli.dispatch in lean/Acorn/Host/Cli.lean) with no agent.
    microduck-host runs the agent on every option list it admits. Safe: microduck-host with no argument at all, which is refused because it names no --control.
    agent-native steps the agent once for each RAW_WORD after its ten construction words. Safe: agent-native with no argument at all, which prints the usage. Safe as a family: every agent-native command line of exactly ten arguments, the ten construction words with no eleventh argument. It initializes and observes when the construction is admitted and prints the usage when it is not, without a step either way; an example is agent-native 1 3 1 1 final per-step declared learned discounted expectation. A near miss is outside the family: an eleventh argument is a RAW_WORD and steps the agent.
    checkpoint-native steps the agent once for each RAW_WORD given to save or resume. Safe: checkpoint-native with no argument at all, which prints the usage. Safe as a family: every checkpoint-native command line of exactly twelve arguments, of which the first is exactly save, load or resume, the second is FILE, the path of a file that this step itself creates in its fresh temporary directory, and the last ten are the construction words, with no thirteenth argument. With no RAW_WORD, save writes the image of an agent that was never stepped, load reads an image back, and resume reads one and writes it again, each without a step; a construction that is not admitted is refused. An example is checkpoint-native save FILE 1 3 1 1 final per-step declared learned discounted expectation and then the same line with load or resume. A near miss is outside the family: a thirteenth argument is a RAW_WORD, with which save and resume step the agent and which load refuses.
    swifttd-native steps a learner STEP_COUNT times, and once when it is given no argument. Safe: swifttd-native 0, which builds the initial learner and steps nothing.
    control-native, temporal-native and feature-native step a learner when given no argument and when given two numbers: the first two apply control and option updates, and feature-native applies the feature tester's step (FeatureRuntime.retire in lean/Acorn/FeatureReferences.lean). Safe: control-native 0, temporal-native 0 and feature-native 0, one argument each, which print the usage.
    world-native, world-certificates and browser-kernel build no agent and no learner on any route of their entry functions, so every invocation of them is safe.
    acorn-gates diagnostics runs acorn-core audit three times, which steps the agent, and so does ./scripts/verify.sh diagnostics. Safe: acorn-gates with no argument at all, acorn-gates build-executing, acorn-gates site and acorn-gates site write.
    lean-boundary-audit, native-audit, ownership-audit, corpus-audit, theorem-count, intent-check and frame-check read sources and compiled modules and start only Lean and Lake, so every invocation of them is safe.
    scripts/start.sh starts the viewer with --research-profile ranked --start, so every invocation that reaches its launch starts a core. Safe: ./scripts/start.sh --help, and ./scripts/start.sh --prepare-only, which stops after the build. After a build the script prints what the launcher starts, and after a failure it says to run the same command again with the same options: neither is a reason to run the launcher without --prepare-only. ./scripts/lean.sh exe NAME ARGS and lake exe NAME ARGS run NAME with ARGS, and NAME's line decides. The merge gate ./scripts/gate.sh starts no program that steps a learner, and neither does ./scripts/verify.sh with no argument at all, ./scripts/verify.sh build-executing, ./scripts/verify.sh site or ./scripts/verify.sh site write, which pass their arguments to acorn-gates. A run made inside Lean or by a re-implementation falls under the rule as a run of a program does; CONTRIBUTING.md, "What counts as a run", says which computations inside Lean are runs and which are proof search.

    Driving a program. Run the built program itself, for the smallest run that shows the claim, and use only an invocation that the program's line above calls safe. A passing gate leaves every program under lean/.lake/build/bin. Build a missing one with no-mistakes admit --memory 12GiB --limit "none; the Test command's measured peak 11.3 GiB" -- ./scripts/lean.sh build NAME, and run any other job that may use more than about 2 GiB through no-mistakes admit with its declared peak. Keep every run's files in a fresh temporary directory outside the checkout. Report each drive of a program that builds the agent or a learner, a safe one included, with what it computed and what it showed, so that the pull request can list it as a computation on the agent (CONTRIBUTING.md, "What counts as a run").

    Driving the viewer. Start acorn-viewer only by this recipe. It has two parts, each of which alone starts no core. First, a child command that cannot be a core: give --cmd false and no --research-profile, so that the only child its supervisor can start is /bin/sh -c "exec false". Second, an explicitly stopped state: make a fresh empty directory, and before starting the viewer write into it a file named state.json that holds the one line {"seed":1,"desired":"stopped","run_id":"0000000000000001","agent_epoch":0,"origin":"fresh","process_started":false}, which is the text that PersistedState.encode in lean/Acorn/Host/Viewer/PersistedState.lean gives for a stopped run that has started no process. Then, with that directory as the working directory and DIR its path, run exactly acorn-viewer --cmd false --run-dir DIR --port 0 --control-stdin, with no --start and no --open-browser. The working directory matters because the viewer moves a file named acorn-weights.ckpt from its working directory into the run directory when it finds one. Stop the viewer by writing the line stop to its standard input, which must stay open until then. A viewer that refuses the state file exits with status 1 before it serves anything: report that, and never start it without the file. This recipe serves the built page in its stopped state, which shows the page's text, layout, controls and stopped lifecycle. In a viewer started by this recipe the page's Start button may be pressed: the only child it can start is the command false, whose exit exercises the lifecycle and its handling of a failed child. That is safe because of the child command, so never press Start in a viewer started in any other way. The recipe shows no panel fed by frames, since this child writes none, and no earlier map or checkpoint, since its fresh directory holds none. Report a claim about a state that only a running core supplies open.

    scripts/start.sh can install system packages and starts a core. For a change to the script itself, drive ./scripts/start.sh --help, or ./scripts/start.sh --prepare-only after reading that it would install nothing here, and report a claim about its launch open. microduck-host requires its --control and --depth sockets from the simulator's daemons, and the simulator is not in this repository. When what a claim needs cannot be stood up as a disposable process of this run, or cannot be shown without stepping a learner, report the claim open with that reason.

    Files that an earlier run left. What a run of Acorn's agent or a learner produced without the owner's authorization is evidence of nothing and is used for nothing: a validation step neither opens nor cites a log, checkpoint, state file, screenshot or other file produced by a run of Acorn's agent or a learner that the owner did not authorize for the change under validation, and where it meets one it reports the path and leaves the file as it is. The line is drawn by admission, not by place: the sentence covers every such file unless it is tracked in the repository at the commit under validation. A tracked file was admitted by review, such as the records of registered studies under docs/studies, and is read like any other tracked file; every other such file is covered wherever it sits, inside the checkout or outside it, a run directory or an evidence directory left inside a working copy included. One more file is exempt beside tracked ones: a file that the change's intent names, exactly, as supplied by the owner for inspection, with the owner's authorization stated in the owner's words or by a pointer to where they are recorded; an intent written by an agent cannot create the exemption on its own word. The exemption covers reading that one file and nothing wider: no other file of the same run, no file found beside it, and no stepping of anything from it. The merge gate's own outputs, the outputs of proofs and this step's own capture of a stopped viewer are not files that a learner run produced. Where a step cannot tell whether an untracked file came from such a run, it does not open the file and says so.

    The machine. Start, stop, reconfigure or reset none of the machine's own services that this run did not create: a container runtime or virtual machine, a system daemon, a package manager's global state or a shared database. Stop only a process this run started, by the process id recorded when it started, never by matching a name or command line.

    What a run shows. A live result here is a smoke test: this run of this program did the one observable thing the claim names (CONTRIBUTING.md). It is never acceptance evidence, and it settles no claim that the agent learns, achieves a goal or meets a theorem; those belong to proofs and to registered studies, so report such a claim from its proof or as open. Do not sweep seeds, compare scores, tune anything, rerun learning or promote a default (AGENTS.md). Being a smoke test gives no leave to start a learner: the rule on learners decides what may be started.
