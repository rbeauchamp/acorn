# Configuration of the no-mistakes pipeline, which validates every change to Acorn before it
# reaches GitHub. no-mistakes reads every setting below only from the copy of this file on the
# default branch, so a change to it governs the runs that follow its merge, not its own.
#
# The local pipeline is Acorn's merge gate; GitHub Actions runs no check on a pull request or a
# push. Its Test step runs scripts/gate.sh in a checkout of the exact commit it validates, holding
# only tracked files. The script provisions the pinned dependencies and runs every check the
# verification workflows ran: both stages of ./scripts/verify.sh and the Regula audit
# ./scripts/regula.sh. Any failing check fails the step.
no_ci: true

commands:
  test: ./scripts/gate.sh

# Dependency provisioning, the largest part of a run from nothing, is reused across runs. For each
# run's base commit on the default branch, no-mistakes runs the command once and stores
# lean/.lake/packages: the locked dependency checkouts and their build outputs. A run starts from a
# private copy only while each file below has the same content as at that base, so the copy holds
# the revisions the run's lock files name, built by the same toolchain. Lake then rebuilds whatever
# its traces do not show current, and the script's provisioning builds anything missing. Acorn's own
# modules are compiled in every run: their outputs in lean/.lake/build are read without any check,
# and Acorn's verification keeps Lake's artifact cache off.
#
# Memory, measured on 2026-10-28 on a fresh clone with 14 cores, as the summed physical footprint of
# the command's processes sampled every 2 s: provisioning from nothing peaked at 3.1 GiB, and the
# whole Test command at 11.3 GiB, during the Regula audit. Nothing enforces either bound.
build_outputs:
  command: no-mistakes admit --memory 4GiB --limit "none; measured peak 3.1 GiB" -- ./scripts/gate.sh provision
  directories:
    - lean/.lake/packages
  toolchain_files:
    - lean/lean-toolchain
    - lean/lake-manifest.json
    - site/lean-toolchain
    - site/lake-manifest.json

# The Test step builds Acorn and its documents and replays the claimed modules in the kernel.
heavy_steps:
  test:
    memory: 12GiB
    limit: none; measured peak 11.3 GiB

# Pull request descriptions. Acorn squash-merges each pull request, so its description becomes the
# commit message on main, and every description carries the sections the template names: Mission
# accounting, Decisions, Accepted risk and, for a defect fix, Root cause. Without a template, the
# pull request step of every run on an open pull request (after a rebase or a repair, for example)
# redrafts its whole description, dropping what its author wrote there. With one, no-mistakes drafts
# a new pull request's description from the template and refuses one that loses, renames or
# reorders its top-level (`#`) headings. Later runs keep the text outside the generated appendix,
# masking only home-directory paths and control characters in it, and refresh only that appendix
# (no-mistakes' repo-config reference, "pr.template" and "Author-preserving regeneration", and
# internal/pipeline/steps/pr_ownership.go). It reads the template's bytes from the default branch. A
# template that is empty, not UTF-8, holds a NUL byte, exceeds 16 KiB, is a symbolic link or
# contains no-mistakes' own publication markers fails every pull request step. A description an
# earlier run wrote without a template holds that run's evidence outside any appendix; no-mistakes
# updates it only after that evidence is removed by hand.
pr:
  template: .github/pull_request_template.md

# Tests are no evidence here. Acorn establishes a change's claims by proof, construction and
# derivation, never by tests (AGENTS.md, "Correct by construction"). The pipeline's review and test
# agents read this file and no-mistakes' own contracts, not a contributor's instructions, so this
# file is where they learn that rule. `policy: forbid` tells every pipeline agent that a test is no
# evidence and that none may be added. It also makes the pipeline report, at its Test step, each
# line the listing below prints for a change and not for its base, and refuse to publish such a
# line unreported.
#
# The listing prints the tests that Lake, Acorn's build tool, defines. Lake knows one kind of test:
# a package's test driver, the script, executable or library that `lake test` runs, set by the
# package's `testDriver` option or by tagging one target `@[test_driver]` (Lake at Lean v4.35.0:
# `Package.test` in Lake/CLI/Actions.lean, and Lake/Load/Lean/Eval.lean). Every directory with a
# `lakefile.lean` or `lakefile.toml` is a package that `lake test` can run there (`resolveConfigFile`
# in Lake/Load/Package.lean). So the listing loads each directory holding such a file in Git's
# index of the listed snapshot, and prints `{"package":<directory>,"test_driver":<driver>}` for each
# package that configures a driver.
#  - Lake's own `loadPackage` loads each package, as `lake check-test` does, under the toolchain
#    elan selects in its directory. `lake check-test` itself cannot serve: it exits 1 both when the
#    package configures no driver and when it fails to load. The Lean program below runs Lake's
#    compiled code (libLake_shared) and exits non-zero when a package fails to load, so the listing
#    then fails instead of printing an empty or partial list.
#  - Configuration file names match without regard to case, as Lake finds them on a
#    case-insensitive file system. A package path that Git prints quoted (one holding a quote, a
#    backslash or a control character) fails the listing, since the quoted form is not the path.
#  - The program uses Lake's public Lean interface. A toolchain whose Lake changes the signatures it
#    calls makes the listing fail. A change in what `loadPackage` records as a package's test driver
#    is not detected: the listing would then print nothing for that driver and pass.
# A test Lake does not know, such as a command in a Lean file that runs code on chosen inputs, is
# not listed. `forbid` leaves it to the review agent, whom it tells to report every test a change
# adds; that is an instruction an agent follows, not a check.
#
# Memory. Measured on 2026-11-02 with /usr/bin/time -l on a copy of the tracked files, loading the
# lean package peaked at 1.13 GiB of physical footprint and 2.23 GiB resident, and the site package
# at 0.22 GiB and 1.30 GiB. Most of the resident memory is the .olean files Lean maps, which the
# system can drop without swapping. Each load runs through `no-mistakes admit` with a 2 GiB bound,
# which it takes from the share of work already admitted, such as the Test step declared in
# heavy_steps above, or otherwise waits for in the machine's memory budget beside all other admitted
# work. Nothing enforces the bound.
test:
  tests_as_evidence:
    policy: forbid
    list_command: |
      set -eu
      work=$(mktemp -d "$PWD/.test-listing.XXXXXX")
      trap 'rm -rf "$work"' EXIT
      cat > "$work/driver.lean" <<'EOF'
      import Lake.CLI.Main
      open Lake

      /-- Load the Lake package in the working directory as `lake check-test` loads it, and write
      to the output file one JSON line naming the package and its test driver, or nothing when it
      configures none. A package that fails to load exits non-zero. -/
      def main (args : List String) : IO UInt32 := do
        let [pkgPath, out] := args
          | throw <| IO.userError "usage: <package path> <output file>"
        let (elanInstall?, leanInstall?, lakeInstall?) <- findInstall?
        let opts : LakeOptions := {elanInstall?, leanInstall?, lakeInstall?}
        let cfg <- match <- opts.mkLoadConfig.toBaseIO with
          | .ok cfg => pure cfg
          | .error e => throw <| IO.userError (toString e)
        let some pkg <- (loadPackage cfg).toBaseIO {out := .stderr}
          | return 1
        IO.FS.writeFile out <| if pkg.testDriver.isEmpty then "" else
          (Lean.Json.mkObj [("package", .str pkgPath), ("test_driver", .str pkg.testDriver)]).compress ++ "\n"
        return 0
      EOF
      git -c core.quotePath=false ls-files -- ':(glob,icase)**/lakefile.lean' ':(glob,icase)**/lakefile.toml' > "$work/configs"
      while IFS= read -r config; do dirname -- "$config"; done < "$work/configs" | LC_ALL=C sort -u > "$work/packages"
      if [ ! -s "$work/packages" ]; then
        echo "no Lake package configuration is tracked" >&2
        exit 1
      fi
      while IFS= read -r pkg; do
        case $pkg in
          \"*) echo "Git prints the package path $pkg quoted" >&2; exit 1 ;;
        esac
        if ! (
          cd "$pkg" &&
          prefix=$(lean --print-prefix) &&
          lib=$prefix/lib/lean/libLake_shared.dylib &&
          { [ -e "$lib" ] || lib=$prefix/lib/lean/libLake_shared.so; } &&
          no-mistakes admit --memory 2GiB --limit "none; measured peak 1.13 GiB footprint, 2.23 GiB resident" -- \
            lean --load-dynlib="$lib" --run "$work/driver.lean" "$pkg" "$work/driver"
        ) >&2; then
          echo "Lake could not report the test driver of package $pkg" >&2
          exit 1
        fi
        cat "$work/driver"
        rm "$work/driver"
      done < "$work/packages"

  # A `no-surface` verdict says that no claim of a change needs execution against a running
  # product. By default it parks the Test step to ask whether to proceed without live validation.
  # Here it completes the step: for a proof or document change that verdict is the normal result,
  # and the question guards against something cheap to undo, since a run of Acorn's programs is a
  # smoke test and never acceptance evidence (CONTRIBUTING.md), and every claim stays listed on the
  # pull request.
  #
  # no-mistakes documents `proceed` as a repository's declaration that it has no running product to
  # drive, and says so to the step's agent in a fixed line of its prompt (`testClaimParkingRules`
  # in internal/pipeline/steps/test_claims.go). That declaration is not true of Acorn, which has a
  # viewer and native hosts that can be run. Here `proceed` decides only what a `no-surface` verdict
  # does; `no-go`, `inconclusive` and the refusal of a `pass` or `fail` claim under `no-surface`
  # stay as they are. The runbook below reaches the agent's evidence prompt in its "Context"
  # section, ahead of that line (`trustedTestInstructionsSection` in
  # internal/pipeline/steps/test.go), so it corrects the line in advance and says which changes have
  # a surface. no-mistakes keeps the line breaks of the runbook and collapses the white space within
  # each line. It reads both settings only from the copy on the default branch. Nothing checks the
  # agent's judgment of a change: one with a surface that it judges to have none lands undriven, an
  # accepted risk for the reason above.
  no_surface: proceed
  instructions: |
    A later line of these instructions says that this repository declares it has no running product to drive. That line is no-mistakes' fixed wording for the setting test.no_surface: proceed. It is not true of Acorn, which has programs that a person or a world runs. Here the setting decides only that a no-surface verdict does not park. Judge each change by what follows.

    The programs. The lean_exe declarations in lean/lakefile.lean are the complete list, and each one's root module sorts it. A program rooted under AcornTools is an audit or build tool of the merge gate. Every other program serves a person or a world: for example acorn-viewer with its core acorn-core, microduck-host and the native command-line consumers. scripts/start.sh launches the viewer, and viewer/static and lean/os hold parts of those programs.

    A change has a surface when it alters what one of those programs does, accepts, prints, renders or writes when it runs. Its verdict is go, no-go or inconclusive, never no-surface, even when proofs settle most of its claims. Proofs and the gate settle what they state. Derive a runtime claim for what they do not reach, such as the compiled program's arguments, files, sockets, process lifetime, output or rendering, and drive that claim.

    A change has no surface when it leaves the behaviour of all those programs as it was: proofs and other modules that no such program executes, documents, comments, the audit tools, the gate and this configuration. The gate's result, derivation or reading settle its claims, so run no program for it and return no-surface. The build embeds a digest of every Lean and C source in the native entry points, so any such edit changes that digest; that alone is not a surface.

    Driving a program. Run the built program itself, for the smallest run that shows the claim. A passing gate leaves every program under lean/.lake/build/bin. Build a missing one with no-mistakes admit --memory 12GiB --limit "none; the Test command's measured peak 11.3 GiB" -- ./scripts/lean.sh build NAME, and run any other job that may use more than about 2 GiB through no-mistakes admit with its declared peak. Keep every run's files in a fresh temporary directory outside the checkout. Run the viewer as the last step of scripts/start.sh does, with --run-dir set to that directory and without --open-browser: --control-stdin lets you stop it by writing the line stop to its standard input, which must stay open until then.

    scripts/start.sh can install system packages, so run it only for a change to the script itself, with --no-browser and a --run-dir in that directory, and only after reading that it would install nothing here. microduck-host requires its --control and --depth sockets from the simulator's daemons, and the simulator is not in this repository. When what a claim needs cannot be stood up as a disposable process of this run, report the claim open with that reason.

    The machine. Start, stop, reconfigure or reset none of the machine's own services that this run did not create: a container runtime or virtual machine, a system daemon, a package manager's global state or a shared database. Stop only a process this run started, by the process id recorded when it started, never by matching a name or command line.

    What a run shows. A live result here is a smoke test: this run of this program did the one observable thing the claim names (CONTRIBUTING.md). It is never acceptance evidence, and it settles no claim that the agent learns, achieves a goal or meets a theorem; those belong to proofs and to registered studies, so report such a claim from its proof or as open. Do not sweep seeds, compare scores, tune anything, rerun learning or promote a default (AGENTS.md).
